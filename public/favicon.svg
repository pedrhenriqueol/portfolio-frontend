<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#termBg)" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9" filter="url(#glow)"/>

  <!-- Window Titlebar Separator -->
  <line x1="2" y1="19" x2="62" y2="19" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Window Control Dots -->
  <circle cx="12" cy="10.5" r="2.8" fill="#FF5F56"/>
  <circle cx="20" cy="10.5" r="2.8" fill="#FFBD2E"/>
  <circle cx="28" cy="10.5" r="2.8" fill="#27C93F"/>

  <!-- Prompt Command Symbol >_ -->
  <path d="M 11 31 L 20 38 L 11 45" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monogram PH -->
  <text x="24" y="46" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI Mono', monospace" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="-1">PH</text>

  <!-- Terminal Cursor -->
  <rect x="50.5" y="32" width="4" height="14" rx="1" fill="#27C93F"/>
</svg>
